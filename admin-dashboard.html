<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
display:flex;
}

.sidebar{
width:250px;
background:#1e3a8a;
height:100vh;
color:white;
padding:20px;
position:fixed;
}

.sidebar h2{
margin-bottom:30px;
text-align:center;
}

table img{

width:80px;
height:80px;
object-fit:cover;
border-radius:8px;
border:1px solid #ccc;

}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin:8px 0;
border-radius:8px;
transition:.3s;
}

.sidebar a:hover{
background:white;
color:#1e3a8a;
}

.main{
margin-left:250px;
padding:30px;
width:100%;
}

.main h1{
color:#1e3a8a;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
font-size:35px;
color:#1e3a8a;
margin-bottom:10px;
}

.card p{
font-size:18px;
color:#555;
}

table{
width:100%;
margin-top:30px;
border-collapse:collapse;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

table th{
background:#1e3a8a;
color:white;
padding:15px;
}

table td{
padding:15px;
text-align:center;
border-bottom:1px solid #ddd;
}

button{
padding:8px 15px;
border:none;
border-radius:5px;
cursor:pointer;
}

.approve{
background:green;
color:white;
}

.reject{
background:red;
color:white;
}


.logout{
background:#111827;
color:white;
width:100%;
margin-top:30px;
padding:12px;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>BSHS ADMIN</h2>

<a href="admin-dashboard.html">🏠 Dashboard</a>

<a href="reports.html">📄 Reports</a>

<a href="claim-requests.html">📑 Claim Requests</a>

<a href="claimed-items.html">✅ Claimed Items</a>


<button class="logout" onclick="logout()">Logout</button>

</div>

<div class="main">

<h1>Administrator Dashboard</h1>

<div class="cards">

<div class="card">
<h2 id="totalReports">0</h2>
<p>Total Reports</p>
</div>

<div class="card">
<h2 id="lostReports">0</h2>
<p>Lost Items</p>
</div>

<div class="card">
<h2 id="foundReports">0</h2>
<p>Found Items</p>
</div>

<div class="card">
<h2 id="claimedReports">0</h2>
<p>Claimed Items</p>
</div>


</div>

<script>

function logout(){
    window.location.href="admin-login.html";
}

let reports = JSON.parse(localStorage.getItem("reports")) || [];
let total = reports.length;

let lost = reports.filter(report =>
report.type.toLowerCase().includes("lost")
).length;

let found = reports.filter(report =>
report.type.toLowerCase().includes("found")
).length;

let claimed = reports.filter(report => report.status === "Claimed").length;

document.getElementById("totalReports").innerHTML = total;
document.getElementById("lostReports").innerHTML = lost;
document.getElementById("foundReports").innerHTML = found;
document.getElementById("claimedReports").innerHTML = claimed;


</script>

</body>
</html>
