<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSHS Lost and Found Hub | Admin Login</title>
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{

width:380px;
background:#fff;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.logo{

text-align:center;
margin-bottom:25px;

}

.logo h1{

color:#1e3a8a;
font-size:28px;

}

.logo p{

color:#666;
font-size:14px;

}

.input-box{

margin-bottom:18px;

}

.input-box label{

display:block;
margin-bottom:6px;
font-weight:bold;

}

.input-box input{

width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;

}

.show{

margin-bottom:20px;
font-size:14px;

}

.show input{

margin-right:5px;

}

button{

width:100%;
padding:13px;
border:none;
background:#1e3a8a;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#172554;

}

.back{

text-align:center;
margin-top:20px;

}

.back a{

text-decoration:none;
color:#1e3a8a;
font-weight:bold;

}

.error{

margin-top:15px;
text-align:center;
color:red;
font-size:14px;

}

</style>

</head>

<body>
<div class="container">

<div class="logo">

<h1>BSHS</h1>

<p>Lost and Found Hub</p>

</div>

<div class="input-box">

<label>Username</label>

<input type="text" id="user">

</div>

<div class="input-box">

<label>Password</label>

<input type="password" id="pass">

</div>

<div class="show">

<input type="checkbox" onclick="showPass()">

Show Password

</div>

<button onclick="login()">

LOGIN

</button>

<div class="error" id="error"></div>

<div class="back">

<a href="index.html">

← Back to Homepage

</a>

</div>

</div>

<script>

function showPass(){

let x = document.getElementById("pass");

if(x.type === "password"){
    x.type = "text";
}else{
    x.type = "password";
}

}


function login(){

let u = document.getElementById("user").value;
let p = document.getElementById("pass").value;

if(u === "admin" && p === "admin"){

    window.location.assign("admin-dashboard.html");

}else{

    document.getElementById("error").innerHTML = "Incorrect Username or Password";

}

}

</script>

</body>
</html>
