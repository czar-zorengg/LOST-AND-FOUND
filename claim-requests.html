<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Requests</title>


<style>

table{
width:100%;
margin-top:30px;
border-collapse:collapse;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
display:flex;
}

.sidebar{
width:250px;
background:#1e3a8a;
height:100vh;
color:white;
padding:20px;
position:fixed;
}

.sidebar h2{
margin-bottom:30px;
text-align:center;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin:8px 0;
border-radius:8px;
transition:.3s;
}

.sidebar a:hover{
background:white;
color:#1e3a8a;
}

.main{
margin-left:250px;
padding:30px;
width:100%;
}

.main h1{
color:#1e3a8a;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
font-size:35px;
color:#1e3a8a;
margin-bottom:10px;
}

.card p{
font-size:18px;
color:#555;
}

table th{
background:#1e3a8a;
color:white;
padding:15px;
border:1px solid #ddd;
}

table td{
padding:15px;
text-align:center;
border:1px solid #ddd;
}

button{
padding:8px 15px;
border:none;
border-radius:5px;
cursor:pointer;
}

.approve{
background:green;
color:white;
}

.reject{
background:red;
color:white;
}


.logout{
background:#111827;
color:white;
width:100%;
margin-top:30px;
padding:12px;
}
table img{
width:80px;
height:80px;
object-fit:cover;
border-radius:8px;
border:1px solid #ccc;
}

.delete{
background:#6b7280;
color:white;
}

.delete:hover{
background:#4b5563;
}
table tr:nth-child(even){
background:#f8fafc;
}

table tr:hover{
background:#e0f2fe;
}
</style>
</head>
<body>

<div class="sidebar">

<h2>BSHS ADMIN</h2>

<a href="admin-dashboard.html">🏠 Dashboard</a>

<a href="reports.html">📄 Reports</a>

<a href="claim-requests.html">📑 Claim Requests</a>

<a href="claimed-items.html">✅ Claimed Items</a>

<button class="logout" onclick="logout()">Logout</button>

</div>

<div class="main">

<h1>Claim Requests</h1>

<table>

<thead>

<tr>

<th>Student</th>
<th>Item</th>
<th>Description</th>
<th>Proof of Ownership</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="claimTable">

</tbody>

</table>
</div>
<script>
function logout() {
    window.location.href = "admin-login.html";
}

let claims = JSON.parse(localStorage.getItem("claims")) || [];
let table = document.getElementById("claimTable");

claims.forEach(function(claim, index) {
    table.innerHTML += `
        <tr>
            <td>${claim.gmail}</td>
            <td>${claim.item}</td>
            <td>${claim.description}</td>
            <td>
                ${claim.proof ? `<img src="${claim.proof}" alt="Proof of Ownership">` : "No proof submitted"}
            </td>
            <td>${claim.status}</td>
            <td>
                <button class="approve" onclick="approveClaim(${index})">Ready for Pickup</button>
                <button class="reject" onclick="rejectClaim(${index})">Reject</button>
                <button class="approve" onclick="claimComplete(${index})">Claimed</button>
                <button class="delete" onclick="deleteClaim(${index})">Delete</button>
            </td>
        </tr>
    `;
});

function approveClaim(index) {
    claims[index].status = "Ready for Pickup";

    let reports = JSON.parse(localStorage.getItem("reports")) || [];

    reports.forEach(function(report) {
        if (report.item === claims[index].item && report.student === claims[index].gmail) {
            report.status = "Claimed";
        }
    });

    localStorage.setItem("reports", JSON.stringify(reports));
    localStorage.setItem("claims", JSON.stringify(claims));

    alert("Claim Approved Successfully!");
    location.reload();
}

function rejectClaim(index) {
    claims[index].status = "Rejected";
    localStorage.setItem("claims", JSON.stringify(claims));
    location.reload();
}

function claimComplete(index) {
    claims[index].status = "Claimed";

    let reports = JSON.parse(localStorage.getItem("reports")) || [];
    reports.forEach(function(report) {
        if (report.item === claims[index].item && report.student === claims[index].gmail) {
            report.status = "Claimed";
        }
    });

    let claimedItems = JSON.parse(localStorage.getItem("claimedItems")) || [];
    claimedItems.push(claims[index]);

    localStorage.setItem("reports", JSON.stringify(reports));
    localStorage.setItem("claimedItems", JSON.stringify(claimedItems));
    localStorage.setItem("claims", JSON.stringify(claims));

    alert("Item marked as Claimed!");
    location.reload();
}

function deleteClaim(index) {
    if (confirm("Delete this claim request?")) {
        claims.splice(index, 1);
        localStorage.setItem("claims", JSON.stringify(claims));
        location.reload();
    }
}
</script>

</body>
</html>
