<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Claim Request | BSHS Lost and Found Hub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
}

header{
    background:#1e3a8a;
    color:white;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

section{
    padding:60px 8%;
}

.title{
    text-align:center;
    margin-bottom:35px;
}

.title h1{
    color:#1e3a8a;
    margin-bottom:10px;
}

.title p{
    color:#555;
}

form{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    width:100%;
    padding:14px;
    background:#1e3a8a;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#172554;
}

.item-box{
    background:#eef2ff;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

</style>

</head>

<body>


<header>

<div class="logo">
BSHS LOST AND FOUND HUB
</div>

<nav>

<a href="index.html">
Home
</a>

<a href="items.html">
Items
</a>

<a href="my-claim-requests.html">
My Claim Requests
</a>

</nav>

</header>


<section>


<div class="title">

<h1>
Claim Request Form
</h1>

<p>
Please provide information to verify your ownership.
</p>

</div>


<form id="claimForm">


<div class="item-box">

<strong>
Selected Item:
</strong>

<span id="selectedItem">
Loading...
</span>

</div>


<div class="group">

<label for="proof">
Proof of Ownership
</label>

<textarea
    id="proof"
    placeholder="Describe details that can prove that this item belongs to you."
    required
></textarea>

</div>


<div class="group">

<label for="details">
Additional Information
</label>

<textarea
    id="details"
    placeholder="Provide any additional information."
></textarea>

</div>


<button type="submit">
Submit Claim Request
</button>


</form>

</section>


<script>


/*
   CHECK LOGIN
*/

let gmail =
    localStorage.getItem(
        "studentGmail"
    );


if(!gmail){

    /*
       Not logged in.
       Go back to login.
    */

    localStorage.setItem(
        "afterLogin",
        "claim-request"
    );

    window.location.href =
        "students-login.html";

}


/*
   GET SELECTED ITEM
*/

let selectedItem =
    localStorage.getItem(
        "claimItem"
    );


document.getElementById(
    "selectedItem"
).textContent =
    selectedItem || "No item selected";


/*
   SUBMIT CLAIM
*/

document
.getElementById("claimForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        let proof =
            document
            .getElementById("proof")
            .value
            .trim();


        let details =
            document
            .getElementById("details")
            .value
            .trim();


        let requests =
            JSON.parse(
                localStorage.getItem(
                    "claimRequests"
                )
            ) || [];


        let request = {

            id:
                "CLAIM-" +
                Date.now(),

            student:
                gmail,

            item:
                selectedItem,

            proof:
                proof,

            details:
                details,

            status:
                "Pending",

            date:
                new Date()
                .toLocaleDateString()

        };


        requests.push(request);


        localStorage.setItem(
            "claimRequests",
            JSON.stringify(requests)
        );


        /*
           Go to My Claim Requests
        */

        window.location.href =
            "my-claim-requests.html";

    }
);

</script>

</body>

</html>
