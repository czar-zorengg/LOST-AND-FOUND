<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claimed Items</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
display:flex;
}

.sidebar{
width:250px;
background:#1e3a8a;
height:100vh;
color:white;
padding:20px;
position:fixed;
}

.sidebar h2{
margin-bottom:30px;
text-align:center;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin:8px 0;
border-radius:8px;
transition:.3s;
}

.sidebar a:hover{
background:white;
color:#1e3a8a;
}

.logout{
background:#111827;
color:white;
width:100%;
margin-top:30px;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
}

.main{
margin-left:250px;
padding:30px;
width:100%;
}

h1{
color:#1e3a8a;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

table th{
background:#1e3a8a;
color:white;
padding:15px;
}

table td{
padding:15px;
text-align:center;
border-bottom:1px solid #ddd;
}

table img{
width:80px;
height:80px;
object-fit:cover;
border-radius:8px;
border:1px solid #ccc;
}

.status{
background:green;
color:white;
padding:6px 12px;
border-radius:20px;
font-size:14px;
font-weight:bold;
display:inline-block;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>BSHS ADMIN</h2>

<a href="admin-dashboard.html">🏠 Dashboard</a>

<a href="reports.html">📄 Reports</a>

<a href="claim-requests.html">📑 Claim Requests</a>

<a href="claimed-items.html">✅ Claimed Items</a>


<button class="logout" onclick="logout()">Logout</button>

</div>

<div class="main">

<h1>Claimed Items</h1>

<table>

<thead>

<tr>

<th>Photo</th>
<th>Student</th>
<th>Type</th>
<th>Item</th>
<th>Category</th>
<th>Location</th>
<th>Date</th>
<th>Status</th>

</tr>

</thead>

<tbody id="claimedTable">

</tbody>

</table>
<script>

function logout(){
    window.location.href = "admin-login.html";
}

let reports = JSON.parse(localStorage.getItem("reports")) || [];

let claimedItems = reports.filter(report => report.status === "Claimed");

let table = document.getElementById("claimedTable");

if(claimedItems.length === 0){

    table.innerHTML = `
    <tr>
        <td colspan="8">No claimed items yet.</td>
    </tr>
    `;

}else{

    claimedItems.forEach(report =>{

        table.innerHTML += `

        <tr>

        <td>
        ${
            report.photo
            ? `<img src="${report.photo}" alt="Item Photo">`
            : "No Photo"
        }
        </td>

        <td>${report.student || "-"}</td>

        <td>${report.type}</td>

        <td>${report.item}</td>

        <td>${report.category}</td>

        <td>${report.location}</td>

        <td>${report.date}</td>

        <td><span class="status">Claimed</span></td>

        </tr>

        `;

    });

}

</script>

</body>
</html>
