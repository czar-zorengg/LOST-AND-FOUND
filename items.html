<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lost and Found Items | BSHS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
color:#1f2937;
}

.claim-btn:hover{
background:#15803d;
}

header{
background:#1e3a8a;
color:white;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
}


.logo{
font-size:24px;
font-weight:bold;
}


nav a{
color:white;
text-decoration:none;
margin-left:20px;
}


section{
padding:60px 8%;
}


.title{
text-align:center;
margin-bottom:40px;
}


.title h1{
color:#1e3a8a;
font-size:35px;
}


.search{

text-align:center;
margin-bottom:30px;

}


.search input{

width:60%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;

}


.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;

}


.card{

background:white;
border-radius:14px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,.08);

}


.card img{

width:100%;
height:180px;
object-fit:cover;

}


.content{

padding:20px;

}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
margin-bottom:12px;
}




.lost{

background:#fee2e2;
color:#b91c1c;

}


.found{

background:#dcfce7;
color:#166534;

}

.claim-btn{
background:#2563eb;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin-top:15px;
transition:0.3s;
}

.claim-btn:hover{
background:#15803d;
}

</style>

</head>


<body>


<header>

<div class="logo">
BSHS LOST AND FOUND HUB
</div>



<nav id="navMenu">

<a href="index.html">Home</a>

<a href="items.html">Items</a>

<a href="students-login.html">Login</a>

</nav>

</header>



<section>


<div class="title">

<h1>Lost and Found Items</h1>

<p>
Search reported lost and found belongings.
</p>

</div>



<div class="search">

<input type="text" placeholder="Search item...">

</div>


<div class="cards" id="itemsContainer">


</div>



<div class="cards" id="itemsContainer"

</div>


</section>

<script>

function claimItem(index){

    localStorage.setItem("claimIndex", index);
    sessionStorage.setItem("afterLogin", "claim");

    window.location.href = "students-login.html";

}

</script>
<script>

let email = localStorage.getItem("studentGmail");

if(email){

document.getElementById("navMenu").innerHTML=`

<a href="index.html">Home</a>

<a href="items.html">Items</a>

<a href="report.html">Report</a>

<a href="my-reports.html">My Reports</a>

<a href="#" onclick="logout()">Logout</a>

`;

}

function logout(){

localStorage.removeItem("studentGmail");

window.location.href="index.html";

}
let reports = JSON.parse(localStorage.getItem("reports")) || [];

reports = reports.filter(function(report){
    return report.status !== "Claimed";
});

let container = document.getElementById("itemsContainer");

reports.forEach(function(report,index){

if(report.status !== "Approved"){
    return;
}

let badge = report.type.toLowerCase().includes("lost")
? "lost"
: "found";

let image = report.photo && report.photo !== ""
? report.photo
: "https://via.placeholder.com/300x180?text=No+Image";

container.innerHTML += `

<div class="card">

<img src="${image}">

<div class="content">

<span class="badge ${badge}">
${report.type}
</span>

<h2>${report.item}</h2>

<p><b>Location:</b> ${report.location}</p>

<p><b>Date:</b> ${report.date}</p>

<p>${report.description}</p>

<br>

<button class="claim-btn"
onclick="claimItem(${index})">

Claim Item

</button>

</div>

</div>

`;

});
</script>
<script>

function claimItem(itemID){

    /*
       Save the selected item
    */

    localStorage.setItem(
        "claimItem",
        itemID
    );


    /*
       Check if student is already logged in
    */

    let loggedIn =
        localStorage.getItem("studentGmail");


    if(loggedIn){

        /*
           Already logged in
           → Claim Request Form
        */

        window.location.href =
            "claim.html";

    }else{

        /*
           Not logged in
           → Login first
        */

        localStorage.setItem(
            "afterLogin",
            "claim-request"
        );

        window.location.href =
            "students-login.html";

    }

}

</script>
</body>

</html>
