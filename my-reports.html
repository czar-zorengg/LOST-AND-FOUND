<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Reports | BSHS Lost and Found Hub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#1f2937;
}


/* HEADER */

header{
    background:#1e3a8a;
    color:white;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    font-weight:500;
}

nav a:hover{
    text-decoration:underline;
}


/* SECTION */

section{
    padding:40px 8%;
}

h1{
    color:#1e3a8a;
    margin-bottom:10px;
}

.subtitle{
    color:#555;
    margin-bottom:20px;
}


/* TABLE */

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

th{
    background:#1e3a8a;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #ddd;
}


/* STATUS */

.pending{
    color:orange;
    font-weight:bold;
}

.approved{
    color:green;
    font-weight:bold;
}

.rejected{
    color:red;
    font-weight:bold;
}

.claimed{
    color:blue;
    font-weight:bold;
}


/* NO REPORT */

.no-report{
    text-align:center;
    padding:30px;
    color:#777;
}


/* MOBILE */

@media(max-width:768px){

    header{
        flex-direction:column;
        gap:15px;
    }

    nav a{
        margin:0 8px;
    }

    section{
        padding:30px 4%;
    }

    table{
        font-size:13px;
    }

    th,
    td{
        padding:10px 5px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<div class="logo">
BSHS LOST AND FOUND HUB
</div>


<nav>

<a href="index.html">
Home
</a>

<a href="items.html">
Items
</a>

</nav>

</header>


<!-- MY REPORTS -->

<section>

<h1>
My Reports
</h1>

<p class="subtitle">
Here are the reports submitted through this browser.
</p>


<table>

<thead>

<tr>

<th>
Item
</th>

<th>
Type
</th>

<th>
Category
</th>

<th>
Location
</th>

<th>
Status
</th>

</tr>

</thead>


<tbody id="myTable">

</tbody>

</table>

</section>


<script>


/*
    GET REPORTS FROM LOCAL STORAGE

    IMPORTANT:
    Walang login requirement dito.
*/

let reports =
    JSON.parse(
        localStorage.getItem("reports")
    ) || [];


let table =
    document.getElementById("myTable");


/*
    IF THERE ARE NO REPORTS
*/

if(reports.length === 0){

    table.innerHTML = `

        <tr>

            <td
                colspan="5"
                class="no-report"
            >

                No reports submitted yet.

            </td>

        </tr>

    `;

}


/*
    DISPLAY ALL REPORTS
*/

else{

    reports.forEach(function(report){

        let status =
            report.status || "Pending";


        let statusClass =
            "pending";


        if(
            status.toLowerCase() ===
            "approved"
        ){

            statusClass =
                "approved";

        }


        else if(
            status.toLowerCase() ===
            "rejected"
        ){

            statusClass =
                "rejected";

        }


        else if(
            status.toLowerCase() ===
            "claimed"
        ){

            statusClass =
                "claimed";

        }


        table.innerHTML += `

            <tr>

                <td>
                    ${report.item || "-"}
                </td>

                <td>
                    ${report.type || "-"}
                </td>

                <td>
                    ${report.category || "-"}
                </td>

                <td>
                    ${report.location || "-"}
                </td>

                <td class="${statusClass}">
                    ${status}
                </td>

            </tr>

        `;

    });

}


</script>


</body>

</html>
