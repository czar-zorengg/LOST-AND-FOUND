<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
display:flex;
}

.sidebar{
width:250px;
background:#1e3a8a;
height:100vh;
color:white;
padding:20px;
position:fixed;
}

.sidebar h2{
margin-bottom:30px;
text-align:center;
}

table img{

width:80px;
height:80px;
object-fit:cover;
border-radius:8px;
border:1px solid #ccc;

}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin:8px 0;
border-radius:8px;
transition:.3s;
}

.sidebar a:hover{
background:white;
color:#1e3a8a;
}

.main{
margin-left:250px;
padding:30px;
width:100%;
}

.main h1{
color:#1e3a8a;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
font-size:35px;
color:#1e3a8a;
margin-bottom:10px;
}

.card p{
font-size:18px;
color:#555;
}

table th{
background:#1e3a8a;
color:white;
padding:15px;
border:1px solid #ddd;
}

table td{
padding:15px;
text-align:center;
border:1px solid #ddd;
}

button{
padding:8px 15px;
border:none;
border-radius:5px;
cursor:pointer;
}

.approve{
background:green;
color:white;
}

.reject{
background:red;
color:white;
}


.logout{
background:#111827;
color:white;
width:100%;
margin-top:30px;
padding:12px;
}
table img{
width:80px;
height:80px;
object-fit:cover;
border-radius:8px;
border:1px solid #ccc;
}

.delete{
background:#6b7280;
color:white;
}

.delete:hover{
background:#4b5563;
}
table tr:nth-child(even){
background:#f8fafc;
}

table tr:hover{
background:#e0f2fe;
}
</style>
</head>
<body>

<div class="sidebar">

<h2>BSHS ADMIN</h2>

<a href="admin-dashboard.html">🏠 Dashboard</a>

<a href="reports.html">📄 Reports</a>

<a href="claim-requests.html">📑 Claim Requests</a>

<a href="claimed-items.html">✅ Claimed Items</a>


<button class="logout" onclick="logout()">Logout</button>

</div>

<div class="main">

<h1>Reports</h1>

<table>

<thead>

<tr>
<th>Student</th>
<th>Type</th>
<th>Item</th>
<th>Category</th>
<th>Location</th>
<th>Date</th>
<th>Description</th>
<th>Photo</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>


<tbody id="reportTable">

</tbody>


</table>

<script>

function logout(){
    window.location.href="admin-login.html";
}

let reports = JSON.parse(localStorage.getItem("reports")) || [];

let table = document.getElementById("reportTable");

reports.forEach(function(report,index){

table.innerHTML += `
<tr>

<td>${report.student}</td>

<td>${report.type}</td>

<td>${report.item}</td>

<td>${report.category}</td>

<td>${report.location}</td>

<td>${report.date}</td>

<td>${report.description}</td>

<td>
<img src="${report.photo}" width="80">
</td>

<td>${report.status}</td>

<td>

<button class="approve" onclick="approve(${index})">
Approve
</button>

<button class="reject" onclick="rejectReport(${index})">
Reject
</button>

<button class="delete" onclick="deleteReport(${index})">
Delete
</button>

</td>

</tr>
`;

});

function approve(index){
reports[index].status = "Approved";

localStorage.setItem("reports", JSON.stringify(reports));

location.reload();
reports[index].status="Approved";

localStorage.setItem("reports",JSON.stringify(reports));

location.reload();

}

function rejectReport(index){

reports[index].status="Rejected";

localStorage.setItem("reports",JSON.stringify(reports));

location.reload();

}

function deleteReport(index){

if(confirm("Delete this report?")){

reports.splice(index,1);

localStorage.setItem("reports",JSON.stringify(reports));

location.reload();

}

}

</script>

</body>
</html>
