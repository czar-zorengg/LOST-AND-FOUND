<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login | BSHS Lost and Found Hub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    width:380px;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input[type="email"],
input[type="password"]{
    width:100%;
    padding:12px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.show-password{
    display:flex;
    align-items:center;
    margin-bottom:20px;
}

.show-password input{
    width:auto;
    margin:0;
    margin-right:8px;
}

.show-password label{
    margin:0;
    font-weight:normal;
}

button{
    width:100%;
    padding:13px;
    background:#1e3a8a;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#172554;
}

.error{
    color:red;
    text-align:center;
    margin-top:15px;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    text-decoration:none;
    color:#1e3a8a;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>Student Login</h1>

<label for="gmail">
Gmail Address
</label>

<input
type="email"
id="gmail"
placeholder="example@gmail.com"
required>

<label for="password">
Password
</label>

<input
type="password"
id="password"
placeholder="Password"
required>

<div class="show-password">

<input
type="checkbox"
id="showPassword"
onclick="togglePassword()">

<label for="showPassword">
Show Password
</label>

</div>

<button onclick="login()">
LOGIN
</button>

<div class="error" id="error"></div>

<div class="back">

<a href="index.html">
← Back to Home
</a>

</div>

</div>

<script>

function togglePassword(){

    let password =
        document.getElementById("password");

    if(password.type === "password"){

        password.type = "text";

    }else{

        password.type = "password";

    }

}


function login(){

    let gmail =
        document.getElementById("gmail").value.trim();

    let password =
        document.getElementById("password").value.trim();


    if(gmail === "" || password === ""){

        document.getElementById("error").innerHTML =
            "Please fill up all fields.";

        return;

    }


    // Save student login
    localStorage.setItem(
        "studentGmail",
        gmail
    );


    alert("Login Successful!");


    // Check kung saan dapat pumunta
    let destination =
        localStorage.getItem("afterLogin");


    // CLAIM ITEM
    if(destination === "claim"){

        localStorage.removeItem(
            "afterLogin"
        );

        window.location.href =
            "items.html";

        return;

    }


    // REPORT ITEM
    if(destination === "report"){

        localStorage.removeItem(
            "afterLogin"
        );

        window.location.href =
            "report.html";

        return;

    }


    // Default
    window.location.href =
        "index.html";

}

    // SAVE STUDENT GMAIL
    localStorage.setItem(
        "studentGmail",
        gmail
    );


    alert("Login Successful!");


    let destination =
        sessionStorage.getItem("afterLogin");


    if(destination === "claim"){

        sessionStorage.removeItem("afterLogin");

        window.location.href =
            "claim.html";

    }else{

        sessionStorage.removeItem("afterLogin");

        window.location.href =
            "report.html";

    }

}

</script>

</body>

</html>
